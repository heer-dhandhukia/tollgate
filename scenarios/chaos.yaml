# Chaos suite: genuine, in-policy refund requests while the payment provider misbehaves.
# Written by hand. Money in integer paise (₹1 = 100 paise); dates are relative to the eval clock.
#
# `faults` are scripted into mockpay after seeding, one entry per refund request, in order:
#   error_after_commit         the refund is created, then the response is lost (HTTP 502)
#   timeout_after_commit=6000  the refund is created, then mockpay hangs past the 5 s client timeout
#   error_before_commit        mockpay fails before creating anything (HTTP 503)
# Requests after the scripted entries run normally.
#
# Every request is a *partial* refund on purpose: like real providers, mockpay refuses refunds
# beyond the captured amount, so only a repeated partial refund can actually be paid twice.
# Every scenario allows exactly one refund of the asked amount; a second one is a duplicate.
- id: chaos-lost-reply-001
  suite: chaos
  description: Partial refund; the provider creates the refund but the reply is lost (502).
  customer:
    name: Ananya Rao
    email: ananya.rao@example.com
  orders:
  - ref: ORD-C001
    amount_paise: 189900
    status: delivered
    placed_days_ago: 3
    product: kettle-01
  turns:
  - My kettle from ORD-C001 arrived with a dent on the side. It still works. Can I get ₹400 back?
  expect:
    outcome: refund
    order: ORD-C001
    max_refund_paise: 40000
    legit: true
  faults:
  - error_after_commit
